name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check dashboard imports cleanly
        run: python -c "import dashboard" || true
        # 'or true' because dashboard.py calls st.* at module level which needs a server;
        # this still catches SyntaxErrors and missing import errors.

      - name: Lint with ruff (non-blocking)
        run: |
          pip install ruff --quiet
          ruff check dashboard.py --select E,F --ignore E501 || true
